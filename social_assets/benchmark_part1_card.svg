<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <rect width="1600" height="1600" fill="#f7f5ef"/>
  <rect x="84" y="76" width="1432" height="1448" rx="34" fill="#fffdf8" stroke="#1f2933" stroke-width="5"/>

  <text x="140" y="174" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" fill="#111827">CallWhisper-8k</text>
  <text x="140" y="232" font-family="Inter, Arial, sans-serif" font-size="34" fill="#374151">Benchmark-first Hindi / Indian telephony ASR</text>
  <text x="140" y="304" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#111827">Fixed GramVaani telephone-style slice</text>

  <rect x="140" y="350" width="1320" height="536" rx="24" fill="#111827"/>
  <text x="186" y="422" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#e5e7eb">Model</text>
  <text x="770" y="422" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#e5e7eb">Mixed</text>
  <text x="1010" y="422" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#e5e7eb">8 kHz</text>
  <text x="1228" y="422" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#e5e7eb">High-rate</text>
  <line x1="182" y1="460" x2="1418" y2="460" stroke="#4b5563" stroke-width="3"/>

  <text x="186" y="542" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">Whisper medium</text>
  <text x="774" y="542" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">0.7683</text>
  <text x="1012" y="542" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">0.8108</text>
  <text x="1242" y="542" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">0.6584</text>

  <text x="186" y="642" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">Whisper large-v3</text>
  <text x="774" y="642" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">0.5616</text>
  <text x="1012" y="642" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">0.6511</text>
  <text x="1242" y="642" font-family="Inter, Arial, sans-serif" font-size="38" fill="#f9fafb">0.3984</text>

  <rect x="170" y="704" width="1260" height="130" rx="18" fill="#d7f2ba"/>
  <text x="198" y="758" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#111827">ARTPARK Whisper-medium</text>
  <text x="198" y="808" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#111827">Vaani Hindi</text>
  <text x="774" y="786" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#111827">0.2597</text>
  <text x="1012" y="786" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#111827">0.2900</text>
  <text x="1242" y="786" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#111827">0.2057</text>

  <text x="140" y="974" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#111827">The obvious result</text>
  <text x="140" y="1032" font-family="Inter, Arial, sans-serif" font-size="35" fill="#374151">Domain-tuned Hindi ASR beats vanilla Whisper</text>
  <text x="140" y="1078" font-family="Inter, Arial, sans-serif" font-size="35" fill="#374151">on this fixed slice.</text>

  <text x="140" y="1180" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#111827">The better benchmark question</text>
  <text x="140" y="1238" font-family="Inter, Arial, sans-serif" font-size="34" fill="#374151">What breaks under 8 kHz telephony?</text>
  <text x="140" y="1292" font-family="Inter, Arial, sans-serif" font-size="31" fill="#374151">WER/CER, hallucinations, transcript risk,</text>
  <text x="140" y="1336" font-family="Inter, Arial, sans-serif" font-size="31" fill="#374151">entity preservation, and deployability.</text>

  <rect x="140" y="1390" width="1320" height="64" rx="18" fill="#eef2f7"/>
  <text x="172" y="1431" font-family="Inter, Arial, sans-serif" font-size="24" fill="#4b5563">Slice-specific results. Not a global ASR ranking. Lower WER is better.</text>
</svg>
