[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "callwhisper-8k"
version = "0.1.0"
description = "Reproducible benchmark and inference pipeline for 8 kHz telephony-style ASR."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Anshul" }
]
dependencies = [
  "jiwer>=3.0.4",
  "numpy>=1.26",
  "openai-whisper>=20231117",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "tabulate>=0.9",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]
colab = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "evaluate>=0.4",
  "transformers>=4.41"
]
finetune = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "evaluate>=0.4",
  "librosa>=0.10",
  "peft>=0.11",
  "tensorboard>=2.16",
  "transformers>=4.41"
]

[project.scripts]
callwhisper = "callwhisper.eval.runner:main"
callwhisper-lora-eval = "callwhisper.eval.lora_runner:main"
callwhisper-diagnostics = "callwhisper.eval.diagnostics:main"
callwhisper-error-review = "callwhisper.eval.error_review:main"
callwhisper-review-summary = "callwhisper.eval.review_summary:main"
callwhisper-gramvaani-inventory = "callwhisper.datasets.gramvaani_inventory:main"
callwhisper-metadata-audit = "callwhisper.datasets.metadata_audit:main"
callwhisper-paired-bootstrap = "callwhisper.eval.paired_bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/callwhisper"]

[tool.ruff]
line-length = 100
target-version = "py310"
